}

android {
    namespace 'com.cortexbot.capture'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cortexbot.capture'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
